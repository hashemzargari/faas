  # Acceptance check, run explicitly by `make dev` (profile keeps it out of a
  # plain `docker compose up`). It activates the pending agents and performs a
  # real SigV4 PUT/HEAD/GET/DELETE; it is not a "container started" check.
  smoke:
    <<: *fass-image
    entrypoint: ["/usr/local/bin/fass-dev-smoke"]
    restart: "no"
    profiles: ["smoke"]
    depends_on:
      coordinator:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      FASS_COORDINATOR_URL: http://coordinator:7000
      FASS_S3_ENDPOINT: http://gateway:8080
      FASS_ACCESS_KEY_ID: dev-access-key
      FASS_SECRET_ACCESS_KEY: dev-secret-key
      FASS_REGION: eu-west-1
