# Placeholder Secret names and image coordinates — replace every `example`/
# `changeme`-style value before installing. Helm never creates these Secrets.

# Three-site values: the recommended RC (geo 2+1 / local 16+4 / aag 2).
# 3 Nexuses x 10 nodes x 2 disks = 60 agents, 20 per Nexus.
#
# For three *independent* Kubernetes clusters use one release per site instead
# (coordinator only in site A; see docs/09-deployment.md §Deployment shapes) and
# point gateway.coordinatorURL / console.coordinatorURL / agents.coordinatorURL
# at site A.

image:
  repository: registry.example.com/fass
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# TLS is the default and fails closed; certificates are existing Secrets, never
# generated or inlined by the chart. SANs must include every name a peer dials
# (see docs/09-deployment.md §TLS and deploy/helm/fass/README.md).
tls:
  enabled: true
  caSecret: fass-ca
  caKey: ca.crt
  requireMTLS: false   # flip to true after every component has a client cert

redundancy:
  geoN: 2
  geoK: 1
  localN: 16
  localK: 4
  aag: 2

coordinator:
  tls:
    certSecret: fass-coordinator-tls
    certKey: tls.crt
    keySecret: fass-coordinator-tls
    keyKey: tls.key
  # Production control plane: PostgreSQL (HA-capable) + 2 replicas. The chart's
  # pre-install/pre-upgrade Job runs `fass-coordinator migrate`; create the DSN
  # Secret before installing.
  replicas: 2
  dbDriver: postgres
  db:
    existingSecret: fass-coordinator-db-dsn
    dsnKey: dsn

gateway:
  replicas: 6
  region: eu-west-1
  tls:
    enabled: true
    existingSecret: fass-gateway-tls
  mtls:
    existingSecret: fass-gateway-client-tls
  keySeed:
    existingSecret: fass-gateway-key-seed

console:
  readOnly: true
  auth:
    existingSecret: fass-console-auth

agents:
  enabled: true
  # Per-node certificates: each agent announces its node IP/FQDN, so the cert
  # for that node must carry that SAN. Keep the shared fields empty and set
  # nodes[].tlsSecret below.
  tls:
    existingSecret: ""
    clientCertSecret: fass-agent-client-tls
    clientCertKey: tls.crt
    clientKeyKey: tls.key
  # One pinned Deployment per node; one container per disk.
  nodes:
    - name: node-a1
      nexus: nexus-a
      tlsSecret: fass-agent-node-a1-tls
      disks:
        - name: disk0
          hostPath: /var/lib/fass/disks/disk0
          port: 7100
          existingSecret: fass-agent-node-a1-disk0
        - name: disk1
          hostPath: /var/lib/fass/disks/disk1
          port: 7101
          existingSecret: fass-agent-node-a1-disk1
    - name: node-a2
      nexus: nexus-a
      tlsSecret: fass-agent-node-a2-tls
      disks:
        - name: disk0
          hostPath: /var/lib/fass/disks/disk0
          port: 7100
          existingSecret: fass-agent-node-a2-disk0
        - name: disk1
          hostPath: /var/lib/fass/disks/disk1
          port: 7101
          existingSecret: fass-agent-node-a2-disk1
    - name: node-a3
      nexus: nexus-a
      tlsSecret: fass-agent-node-a3-tls
      disks:
        - name: disk0
          hostPath: /var/lib/fass/disks/disk0
          port: 7100
          existingSecret: fass-agent-node-a3-disk0
        - name: disk1
          hostPath: /var/lib/fass/disks/disk1
