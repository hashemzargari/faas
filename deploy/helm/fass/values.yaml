# FASS Helm values — production defaults.
#
# The chart can deploy the whole cluster in one release or be split per site
# (e.g. coordinator only in site A; gateways + agents in B/C). Every workload is
# individually toggleable — see docs/09-deployment.md §"Deployment shapes".
#
# Secrets are NEVER created or inlined by this chart. Create them yourself and
# reference them here; `helm template` fails with an actionable message when a
# required Secret reference is missing. Placeholders in the example values files
# are deliberately obvious.

# -- Container image used by every component. The image built by
# deploy/docker/Dockerfile contains all binaries under /usr/local/bin.
image:
  repository: ghcr.io/example/fass
  # -- Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# -- Redundancy Class the cluster is sized for. The chart does not create the
# RC (that is a coordinator API action) but uses these numbers for the gateway's
# default coding parameters and to refuse infeasible topologies. Keep them in
# sync with the RC you create — see docs/09-deployment.md §Sizing.
redundancy:
  geoN: 2
  geoK: 1
  localN: 16
  localK: 4
  # -- Maximum shards of one shard-set per Node (the coordinator's placement
  # invariant). The chart treats it as the per-node disk budget; see
  # docs/09-deployment.md §"AAG is a per-Node rule".
  aag: 2

# -- Pod security defaults. FASS images are distroless and run as uid 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  # -- Defaults to the release fullname.
  name: ""

# -- Transport encryption. TLS is ON by default; every component fails closed
# without certificate material on a current FASS release. Plaintext is an
# explicit dev-only opt-out (`tls.enabled=false` + `tls.allowInsecure=true`),
# never a silent default.
tls:
  enabled: true
  # -- Extra guard: flipping tls.enabled=false requires allowInsecure=true, and
  # the rendered manifests carry a plaintext warning comment + insecure flags.
  allowInsecure: false
  # -- Existing Secret with the cluster CA **public certificate only**
  # (key tls.caKey). The CA private key must never be in the cluster; it is only
  # needed by `fass-gateway pki issue-*` on an operator workstation.
  caSecret: CHANGEME-fass-ca
  caKey: ca.crt
  # -- Require and verify client certificates everywhere (strict mTLS). Roll out
  # with false, then flip to true after every agent/gateway has a client cert.
  requireMTLS: false

coordinator:
  enabled: true
  # -- 1 with the embedded store (single writer). With dbDriver=postgres you may
  # scale this for control-plane HA; the chart then rolls the pods one at a time.
  replicas: 1
  # -- Persistence backend: "embedded" (dev/small, single writer) or
  # "postgres" (production; the coordinator supports --db-driver=postgres and an
  # explicit `fass-coordinator migrate` subcommand).
  dbDriver: embedded
  db:
    # -- REQUIRED when dbDriver=postgres: Secret containing the DSN
    # (postgres://user:pass@host:5432/fass?sslmode=require).
    existingSecret: ""
    dsnKey: dsn
  # -- Apply PostgreSQL migrations on start. Production should leave this false:
  # a helm pre-install/pre-upgrade Job runs `fass-coordinator migrate` instead.
  dbMigrateOnStart: false
  # -- Existing Secrets for the coordinator listener identity (PEM tls.crt/tls.key).
  # The certificate SANs must include every name peers dial:
  # <release>-coordinator, <release>-coordinator.<namespace>.svc, ...svc.cluster.local.
  tls:
    certSecret: CHANGEME-fass-coordinator-tls
    certKey: tls.crt
    keySecret: CHANGEME-fass-coordinator-tls
    keyKey: tls.key
  listenPort: 7000
  dataDir: /var/lib/fass
  logLevel: info
  logFormat: json
  maintenance: false
  gc: true
  # -- Only used with dbDriver=embedded. PostgreSQL stores metadata externally.
  persistence:
    enabled: true
    # -- Use an existing PVC instead of creating one.
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

gateway:
  enabled: true
  replicas: 2
  listenPort: 8080
  adminPort: 9000
  # -- Empty = the in-chart coordinator Service. Point at an external
  # coordinator for a per-site release.
  coordinatorURL: ""
  region: eu-west-1
  # -- Chunk size in bytes. Must be divisible by geo_n*local_n and 1 MiB aligned.
  chunkSize: 16777216
  # -- Redundancy Class id used when a bucket/SDP rule does not pick one.
  defaultRedundancyClass: ""
  # -- DEV ONLY: let the gateway mint an ephemeral key seed (data written with it
  # is unreadable after restart). Never enable in production.
  devMode: false
  keySeed:
    # -- REQUIRED unless devMode. Secret key holding the hex tenant key seed.
    # The default is an obvious placeholder so `helm lint` can render; replace
    # it (or use one of the values-*.yaml files) before installing.
    existingSecret: "CHANGEME-fass-gateway-key-seed"
    secretKey: key-seed
  tls:
    # -- S3 edge listener. The Gateway terminates TLS itself when enabled; the
    # Secret must contain a tls.crt/tls.key pair (or set certKey/keyKey).
    # Keep this on unless an L4/L7 load balancer terminates TLS in front.
    enabled: true
    existingSecret: "CHANGEME-fass-gateway-tls"
    certKey: tls.crt
    keyKey: tls.key
  # -- Data-plane / control-plane identity. The gateway verifies agents and the
  # coordinator against the global CA (tls.caSecret) and presents this client
  # certificate when mTLS is required. The certificate must carry the
  # clientAuth EKU (`fass-gateway pki issue-client`).
  mtls:
    # -- Optional for server-auth-only TLS; required when tls.requireMTLS=true.
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
  # -- Data-plane mode: require (default) | auto (mixed-mode rollout) | off
  # (only valid together with tls.enabled=false / --insecure).
  agentTLS: require
  # -- Explicit plaintext control-plane opt-in (dev/transition only); ignored
  # when tls.enabled=true.
  coordinatorInsecure: false
  # -- Optional Smart Data Placement policy (JSON) in an existing ConfigMap.
  sdpPolicy:
    existingConfigMap: ""
    configMapKey: sdp-policy.json
  offloaderWorkers: 16
  shardParallel: 16
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 8Gi
  service:
    # -- ClusterIP behind your L4/L7 load balancer, or LoadBalancer/NodePort.
    type: ClusterIP
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

console:
  enabled: true
  replicas: 1
  listenPort: 8081
  # -- Empty = the in-chart coordinator Service.
  coordinatorURL: ""
  # -- Read-only by default: activate/decommission are disabled unless false.
  readOnly: true
  auth:
    # -- REQUIRED. Secret with the HTTP Basic credentials (keys: console-user,
    # console-password). Obvious placeholder by default so `helm lint` renders.
    existingSecret: "CHANGEME-fass-console-auth"
    userKey: console-user
    passwordKey: console-password
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  service:
    type: ClusterIP
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

agents:
  # -- Agents are site-specific (node names, disk mounts, per-node announce
  # secrets), so the default values deploy none. Enable in a per-site values
  # file and fill agents.nodes; see values-three-site.yaml.
  enabled: false
  # -- Existing Secrets for the agent shard-listener identity and the client
  # identity used for agent-to-agent repair (clientAuth EKU). A server cert must
  # contain a SAN for every name a peer dials: with hostNetwork=true the agent
  # announces its node IP, so a shared cert needs every node IP; otherwise set a
  # per-node `tlsSecret` in agents.nodes[]. See docs/09-deployment.md §TLS.
  tls:
    existingSecret: CHANGEME-fass-agent-tls
    certKey: tls.crt
    keyKey: tls.key
    clientCertSecret: CHANGEME-fass-agent-client-tls
    clientCertKey: tls.crt
    clientKeyKey: tls.key
  # -- Coordinator URL the agents announce to. Empty = the in-chart coordinator
  # Service (single-cluster install). For a per-site release point this at the
  # site-A coordinator, e.g. https://coordinator.fass.internal:7000.
  coordinatorURL: ""
  basePort: 7100
  repair: true
  scrub: true
  # -- Percentage of each filesystem kept free by the agent.
  reservePercent: 5
  heartbeatInterval: 5s
  # -- Use the host network so the endpoint the agent announces
  # (status.hostIP:port) is reachable by every gateway. Recommended for
  # bare-metal-with-local-disks shapes; the alternative (pod network + hostPort)
  # cannot be automated without knowing the cluster CNI.
  hostNetwork: true
  # -- Extra args appended to every agent container (advanced).
  extraArgs: []
  #
  # Agents are one per disk and pinned per node. One pinned Deployment is
  # rendered per node (not one DaemonSet per Nexus) because each disk has its
  # own one-time announce Secret, and Kubernetes cannot vary a secretKeyRef per
  # pod of a DaemonSet. This is a deliberate workaround for a current product
  # gap: the agent has no --secret-file/env configuration yet (see
  # docs/09-deployment.md §"Known product gaps"). When that lands the chart can
  # collapse to one DaemonSet per Nexus.
  #
  # nodes:
  #   - name: node-a1                 # MUST equal the Kubernetes node name; used as --node-id
  #     nexus: nexus-a
  #     nodeSelector:                 # optional; defaults to kubernetes.io/hostname: node-a1
  #       kubernetes.io/hostname: node-a1
  #     tolerations: []
  #     disks:
  #       - name: disk0
  #         hostPath: /var/lib/fass/disks/disk0
  #         port: 7100
  #         diskId: ""                # optional operator-facing slot label
  #         existingSecret: fass-agent-node-a1-disk0
  #         secretKey: secret
  #     # optional per-node server certificate (recommended: SAN = node IP/FQDN)
  #     tlsSecret: fass-agent-node-a1-tls
  nodes: []
  # -- Escape hatch: allow more disks on a node than aag. Placement still caps
  # shards of one shard-set at aag per Node, so the extra disks only serve other
  # shard sets; see docs/09-deployment.md §"AAG is a per-Node rule".
  allowAgentsPerNodeExceedingAAG: false
  # -- Disable the declared-topology feasibility checks (advanced; see docs/09).
  skipTopologyValidation: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 3Gi
  # -- The disk directories are hostPath; they must already exist and be owned
  # by uid 65532 (see docs/09-deployment.md §"Preparing disks").
  podAnnotations: {}
  podLabels: {}
  tolerations: []
