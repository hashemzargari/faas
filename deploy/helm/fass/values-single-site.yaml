# Placeholder Secret names and image coordinates — replace every `example`/
# `changeme`-style value before installing. Helm never creates these Secrets.

# Single-site values: flat RC geo 1+0 / local 16+4, one Nexus.
# Teaches the same code path without geo redundancy; survives node/disk loss,
# NOT site loss. Use values-three-site.yaml for a real install.

image:
  repository: registry.example.com/fass
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# TLS is the default and fails closed; certificates are existing Secrets, never
# generated or inlined by the chart. SANs must include every name a peer dials
# (see docs/09-deployment.md §TLS and deploy/helm/fass/README.md).
tls:
  enabled: true
  caSecret: fass-ca
  caKey: ca.crt
  requireMTLS: false   # flip to true after every component has a client cert

redundancy:
  geoN: 1
  geoK: 0
  localN: 16
  localK: 4
  aag: 2

coordinator:
  tls:
    certSecret: fass-coordinator-tls
    certKey: tls.crt
    keySecret: fass-coordinator-tls
    keyKey: tls.key
  # Single-site can run on the embedded store (replicas must stay 1). For HA
  # control plane switch to dbDriver: postgres + a DSN Secret and scale replicas.
  dbDriver: embedded
  persistence:
    size: 20Gi

gateway:
  replicas: 2
  tls:
    enabled: true
    existingSecret: fass-gateway-tls
  mtls:
    existingSecret: fass-gateway-client-tls
  keySeed:
    existingSecret: fass-gateway-key-seed

console:
  auth:
    existingSecret: fass-console-auth

agents:
  enabled: true
  # Per-node certificates: each agent announces its node IP/FQDN, so the cert
  # for that node must carry that SAN. Keep the shared fields empty and set
  # nodes[].tlsSecret below.
  tls:
    existingSecret: ""
    clientCertSecret: fass-agent-client-tls
    clientCertKey: tls.crt
    clientKeyKey: tls.key
  # One pinned Deployment per node; one container per disk.
  nodes:
    - name: node-s1
      nexus: nexus-a
      tlsSecret: fass-agent-node-s1-tls
      disks:
        - name: disk0
          hostPath: /var/lib/fass/disks/disk0
          port: 7100
          existingSecret: fass-agent-node-s1-disk0
        - name: disk1
          hostPath: /var/lib/fass/disks/disk1
          port: 7101
          existingSecret: fass-agent-node-s1-disk1
    - name: node-s2
      nexus: nexus-a
      tlsSecret: fass-agent-node-s2-tls
      disks:
        - name: disk0
          hostPath: /var/lib/fass/disks/disk0
          port: 7100
          existingSecret: fass-agent-node-s2-disk0
        - name: disk1
          hostPath: /var/lib/fass/disks/disk1
          port: 7101
          existingSecret: fass-agent-node-s2-disk1
    - name: node-s3
      nexus: nexus-a
      tlsSecret: fass-agent-node-s3-tls
      disks:
        - name: disk0
          hostPath: /var/lib/fass/disks/disk0
          port: 7100
          existingSecret: fass-agent-node-s3-disk0
        - name: disk1
          hostPath: /var/lib/fass/disks/disk1
