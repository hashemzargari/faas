{{- if .Values.coordinator.enabled }}
{{- if not .Values.tls.enabled }}
# WARNING: tls.enabled=false — DEV ONLY. The coordinator listens in plaintext
# and the control plane is unauthenticated; do not use this shape outside dev.
{{- end }}
{{- $c := .Values.coordinator }}
{{- $name := printf "%s-coordinator" (include "fass.fullname" .) }}
{{- $labels := include "fass.labels" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  type: ClusterIP
  selector:
    {{- include "fass.selectorLabels" (dict "root" . "component" "coordinator") | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.listenPort }}
      targetPort: http
      protocol: TCP
---
{{- if and (eq $c.dbDriver "embedded") $c.persistence.enabled (not $c.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  accessModes:
    {{- toYaml $c.persistence.accessModes | nindent 4 }}
  {{- with $c.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  replicas: {{ $c.replicas }}
  strategy:
    {{- if eq $c.dbDriver "postgres" }}
    # PostgreSQL makes the coordinator horizontally scalable; roll safely.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    # The embedded store is single-writer: never run two pods on one volume.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "fass.selectorLabels" (dict "root" . "component" "coordinator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fass.selectorLabels" (dict "root" . "component" "coordinator") | nindent 8 }}
        {{- with $c.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ default (include "fass.fullname" .) .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: coordinator
          image: {{ include "fass.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/fass-coordinator"]
          env:
            {{- if .Values.tls.enabled }}
            - name: FASS_COORDINATOR_TLS_CERT
              value: {{ printf "/etc/fass/tls/server/%s" $c.tls.certKey | quote }}
            - name: FASS_COORDINATOR_TLS_KEY
              value: {{ printf "/etc/fass/tls/server/%s" $c.tls.keyKey | quote }}
            - name: FASS_COORDINATOR_AGENT_SCHEME
              value: "https"
            {{- if .Values.tls.requireMTLS }}
            - name: FASS_COORDINATOR_TLS_CLIENT_CA
              value: {{ printf "/etc/fass/tls/ca/%s" .Values.tls.caKey | quote }}
            - name: FASS_COORDINATOR_REQUIRE_MTLS
              value: "true"
            {{- end }}
            {{- else }}
            - name: FASS_COORDINATOR_DEV
              value: "true"
            - name: FASS_COORDINATOR_AGENT_SCHEME
              value: "http"
            {{- end }}
            - name: FASS_COORDINATOR_DB_DRIVER
              value: {{ $c.dbDriver | quote }}
            {{- if eq $c.dbDriver "postgres" }}
            - name: FASS_COORDINATOR_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.db.existingSecret }}
                  key: {{ $c.db.dsnKey }}
            - name: FASS_COORDINATOR_DB_MIGRATE_ON_START
              value: {{ $c.dbMigrateOnStart | quote }}
            {{- end }}
            - name: FASS_COORDINATOR_LISTEN
              value: ":{{ $c.listenPort }}"
            - name: FASS_COORDINATOR_DATA_DIR
              value: {{ $c.dataDir | quote }}
            - name: FASS_COORDINATOR_LOG_LEVEL
              value: {{ $c.logLevel | quote }}
            - name: FASS_COORDINATOR_LOG_FORMAT
              value: {{ $c.logFormat | quote }}
            - name: FASS_COORDINATOR_MAINTENANCE
              value: {{ $c.maintenance | quote }}
            - name: FASS_COORDINATOR_GC
              value: {{ $c.gc | quote }}
          ports:
            - name: http
              containerPort: {{ $c.listenPort }}
              protocol: TCP
          {{- if .Values.tls.enabled }}
          # The listener is TLS-only and the certificate SANs are peer names, so
          # the local probe verifies liveness, not the certificate (traffic
          # security is enforced on the real peers). -insecure only skips probe
          # certificate verification.
          livenessProbe:
            exec:
              command: ["/usr/local/bin/fass-dev-healthcheck", "-insecure", "https://127.0.0.1:{{ $c.listenPort }}/healthz"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["/usr/local/bin/fass-dev-healthcheck", "-insecure", "https://127.0.0.1:{{ $c.listenPort }}/readyz"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- else }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          {{- if or (eq $c.dbDriver "embedded") .Values.tls.enabled }}
          volumeMounts:
            {{- if eq $c.dbDriver "embedded" }}
            - name: data
              mountPath: {{ $c.dataDir }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls-ca
              mountPath: {{ printf "/etc/fass/tls/ca/%s" .Values.tls.caKey }}
              subPath: {{ .Values.tls.caKey }}
              readOnly: true
            - name: tls-cert
              mountPath: {{ printf "/etc/fass/tls/server/%s" $c.tls.certKey }}
              subPath: {{ $c.tls.certKey }}
              readOnly: true
            - name: tls-key
              mountPath: {{ printf "/etc/fass/tls/server/%s" $c.tls.keyKey }}
              subPath: {{ $c.tls.keyKey }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (eq $c.dbDriver "embedded") .Values.tls.enabled }}
      volumes:
        {{- if eq $c.dbDriver "embedded" }}
        - name: data
          {{- if $c.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" $name) $c.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls-ca
          secret:
            secretName: {{ .Values.tls.caSecret }}
            defaultMode: 0440
        - name: tls-cert
          secret:
            secretName: {{ $c.tls.certSecret }}
            defaultMode: 0440
        - name: tls-key
          secret:
            secretName: {{ $c.tls.keySecret }}
            defaultMode: 0400
        {{- end }}
      {{- end }}
{{- end }}
