{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "fass.fullname" .) .Values.serviceAccount.name }}
  labels:
    {{- include "fass.labels" . | nindent 4 }}
  {{- with .Values.coordinator.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
