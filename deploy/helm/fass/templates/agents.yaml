{{- if .Values.agents.enabled }}
{{- if not .Values.tls.enabled }}
# WARNING: tls.enabled=false — DEV ONLY. Agent shard/repair traffic is
# plaintext; each agent reports insecure=true on /v1/healthz.
{{- end }}
{{- $root := . }}
{{- $a := .Values.agents }}
{{- $coordURL := include "fass.effectiveCoordinatorURL" (dict "root" . "url" $a.coordinatorURL) }}
{{- $labels := include "fass.labels" . }}
{{- range $node := $a.nodes }}
{{- $deployName := printf "%s-agent-%s" (include "fass.fullname" $root) $node.name | trunc 63 | trimSuffix "-" }}
{{- $tlsSecret := "" }}
{{- if $root.Values.tls.enabled }}
{{- $tlsSecret = $node.tlsSecret | default $a.tls.existingSecret }}
{{- end }}
{{- $selectors := dict "root" $root "component" "agent" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $deployName }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: agent
    fass.io/nexus: {{ $node.nexus | quote }}
    fass.io/node: {{ $node.name | quote }}
spec:
  # One pod per node, pinned by nodeSelector; Recreate so two agent processes
  # never race for the same disk during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fass.selectorLabels" $selectors | nindent 6 }}
      fass.io/node: {{ $node.name | quote }}
  template:
    metadata:
      labels:
        {{- include "fass.selectorLabels" $selectors | nindent 8 }}
        fass.io/nexus: {{ $node.nexus | quote }}
        fass.io/node: {{ $node.name | quote }}
        {{- with $a.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with $a.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ default (include "fass.fullname" $root) $root.Values.serviceAccount.name }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $a.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      nodeSelector:
        # Derived from agents.nodes[].name so a pod only runs on the node whose
        # name is announced as --node-id. Extra labels from values are ANDed.
        kubernetes.io/hostname: {{ $node.name | quote }}
        {{- with $node.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      tolerations:
        {{- $tolerations := concat ($a.tolerations | default list) ($node.tolerations | default list) }}
        {{- if $tolerations }}
        {{- toYaml $tolerations | nindent 8 }}
        {{- else }} []
        {{- end }}
      containers:
        {{- range $i, $disk := $node.disks }}
        {{- $port := include "fass.agentPort" (dict "root" $root "disk" $disk "index" $i) }}
        - name: agent-{{ $i }}
          image: {{ include "fass.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/usr/local/bin/fass-agent"]
          args:
            - --disk=/data/{{ $disk.name }}
            - --port={{ $port }}
            - --nexus-id={{ $node.nexus }}
            - --node-id={{ $node.name }}
            # Peers dial this value; the agent certificate must carry it as a
            # SAN (IP SAN with hostNetwork=true, or use a per-node tlsSecret
            # issued with the node FQDN/IP). See docs/09-deployment.md §TLS.
            - --hostname=$(FASS_AGENT_HOST_IP)
            - --coordinator-url={{ $coordURL }}
            - --reserve-pct={{ $a.reservePercent }}
            - --repair={{ $a.repair }}
            - --scrub={{ $a.scrub }}
            - --heartbeat-interval={{ $a.heartbeatInterval }}
            {{- if $disk.diskId }}
            - --disk-id={{ $disk.diskId }}
            {{- end }}
            {{- range $a.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # The announce secret is a file-backed credential: no argv, no env
            # value with the secret itself.
            - name: FASS_AGENT_SECRET_FILE
              value: {{ printf "/etc/fass/secret/%s" ($disk.secretKey | default "secret") | quote }}
            - name: FASS_AGENT_HOST_IP
              valueFrom:
                fieldRef:
                  {{- if $a.hostNetwork }}
                  fieldPath: status.hostIP
                  {{- else }}
                  fieldPath: status.podIP
                  {{- end }}
            {{- if $root.Values.tls.enabled }}
            - name: FASS_AGENT_TLS_CERT
              value: {{ printf "/etc/fass/tls/server/%s" $a.tls.certKey | quote }}
            - name: FASS_AGENT_TLS_KEY
              value: {{ printf "/etc/fass/tls/server/%s" $a.tls.keyKey | quote }}
            - name: FASS_AGENT_TLS_CA
              value: {{ printf "/etc/fass/tls/ca/%s" $root.Values.tls.caKey | quote }}
            - name: SSL_CERT_FILE
              value: {{ printf "/etc/fass/tls/ca/%s" $root.Values.tls.caKey | quote }}
            # Control-plane TLS is configured separately from the shard listener:
            # an https:// coordinator requires this CA bundle.
            - name: FASS_AGENT_COORDINATOR_CA
              value: {{ printf "/etc/fass/tls/ca/%s" $root.Values.tls.caKey | quote }}
            {{- if $a.tls.clientCertSecret }}
            - name: FASS_AGENT_TLS_CLIENT_CERT
              value: {{ printf "/etc/fass/tls/client/%s" $a.tls.clientCertKey | quote }}
            - name: FASS_AGENT_TLS_CLIENT_KEY
              value: {{ printf "/etc/fass/tls/client/%s" $a.tls.clientKeyKey | quote }}
            # Present the same identity to a coordinator running --require-mtls.
            - name: FASS_AGENT_COORDINATOR_CLIENT_CERT
              value: {{ printf "/etc/fass/tls/client/%s" $a.tls.clientCertKey | quote }}
            - name: FASS_AGENT_COORDINATOR_CLIENT_KEY
              value: {{ printf "/etc/fass/tls/client/%s" $a.tls.clientKeyKey | quote }}
            {{- end }}
            {{- if $root.Values.tls.requireMTLS }}
            - name: FASS_AGENT_REQUIRE_MTLS
              value: "true"
            {{- end }}
            {{- else }}
            # Explicit dev-only plaintext opt-in (validated by tls.allowInsecure).
            - name: FASS_AGENT_INSECURE
              value: "true"
            {{- end }}
          ports:
            - name: agent-{{ $i }}
              containerPort: {{ $port }}
              protocol: TCP
          {{- if $root.Values.tls.enabled }}
          # TLS-only listener: the local probe skips certificate verification
          # (SANs are peer names); peer traffic is still verified.
          livenessProbe:
            exec:
              command: ["/usr/local/bin/fass-dev-healthcheck", "-insecure", "https://127.0.0.1:{{ $port }}/v1/healthz"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["/usr/local/bin/fass-dev-healthcheck", "-insecure", "https://127.0.0.1:{{ $port }}/v1/healthz"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- else }}
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: agent-{{ $i }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: agent-{{ $i }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          volumeMounts:
            - name: disk-{{ $i }}
              mountPath: /data/{{ $disk.name }}
            - name: announce-secret-{{ $i }}
              mountPath: /etc/fass/secret
              readOnly: true
            {{- if $root.Values.tls.enabled }}
            - name: tls-ca
              mountPath: {{ printf "/etc/fass/tls/ca/%s" $root.Values.tls.caKey }}
              subPath: {{ $root.Values.tls.caKey }}
              readOnly: true
            - name: tls-server
              mountPath: {{ printf "/etc/fass/tls/server/%s" $a.tls.certKey }}
              subPath: {{ $a.tls.certKey }}
              readOnly: true
            - name: tls-server-key
              mountPath: {{ printf "/etc/fass/tls/server/%s" $a.tls.keyKey }}
              subPath: {{ $a.tls.keyKey }}
              readOnly: true
            {{- if $a.tls.clientCertSecret }}
            - name: tls-client
              mountPath: /etc/fass/tls/client
              readOnly: true
            {{- end }}
            {{- end }}
        {{- end }}
      volumes:
        {{- range $i, $disk := $node.disks }}
        - name: disk-{{ $i }}
          hostPath:
            path: {{ $disk.hostPath | quote }}
            type: Directory
        - name: announce-secret-{{ $i }}
          secret:
            secretName: {{ $disk.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- if $root.Values.tls.enabled }}
        - name: tls-ca
          secret:
            secretName: {{ $root.Values.tls.caSecret }}
            defaultMode: 0440
        - name: tls-server
          secret:
            secretName: {{ $tlsSecret }}
            defaultMode: 0440
        - name: tls-server-key
          secret:
            secretName: {{ $tlsSecret }}
            defaultMode: 0400
        {{- if $a.tls.clientCertSecret }}
        - name: tls-client
          secret:
            secretName: {{ $a.tls.clientCertSecret }}
            defaultMode: 0400
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
